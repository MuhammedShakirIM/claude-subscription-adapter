[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-subscription-adapter"
version = "0.1.0"
description = "An OpenAI-compatible local HTTP adapter for the Claude Code CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "mcp>=2.2,<3"]

[project.scripts]
claude-subscription-adapter = "claude_subscription_adapter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "openai>=1.60", "langchain-openai>=0.3", "langgraph>=0.3", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
